<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex. 04: Meta de economia</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Meta de economia</h1>
  <p><a href="../index.html">← Voltar</a> · Seu Nome</p>

   <form id="formulario">
            <div class="campo"><label for="meta">Meta desejada (R$)</label><input id="meta" type="number" min="0.01"
                    step="0.01" required></div>
            <div class="campo"><label for="deposito">Depósito mensal (R$)</label><input id="deposito" type="number"
                    min="0.01" step="0.01" required></div>
            <div class="campo"><label for="taxa">Rendimento mensal (%) — padrão 0,5%</label><input id="taxa"
                    type="number" min="0" step="0.01" placeholder="0,5"></div>
            <button type="submit">Calcular tempo</button>
        </form>
        <div id="resultado" class="resultado" aria-live="polite">Preencha os campos e clique em calcular.</div>

  <script type="module" src="ex04.js"></script>
</body>
</html>
